<div class="card">
  <div class="card-header">
    <div class="card-header-left">
      <div class="card-icon">📈</div>
      <h2 class="card-title">
        Anexo G - Mais-Valias e Rendimentos de Capitais
      </h2>
    </div>
    <div class="toggle-container">
      <label class="toggle-switch">
        <input
          type="checkbox"
          id="incluirAnexoG"
          class="toggle-input"
          checked
        />
        <span class="toggle-slider"></span>
      </label>
      <span class="toggle-label">Incluir Anexo G</span>
    </div>
  </div>

  <div class="anexo-g-content">
    <!-- Secção 9 - Alienação Onerosa de Partes Sociais -->
    <div class="form-section">
      <h3>
        9. Alienação Onerosa de Partes Sociais e Outros Valores Mobiliários
      </h3>
      <div class="sub-section">
        <h4>
          A. Alienação Onerosa de Partes Sociais e Outros Valores Mobiliários
        </h4>
        <div id="anexoGTableContainer" class="table-container"></div>
      </div>
    </div>

    <!-- Secção 15 - Opção pelo Englobamento -->
    <div class="form-section">
      <h3>15. Opção pelo Englobamento</h3>
      <div class="question-box">
        <p class="question-text">
          Opta pelo englobamento dos rendimentos do Anexo G?
        </p>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="englobamentoAnexoG" value="S" />
            <span>Sim</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="englobamentoAnexoG" value="N" checked />
            <span>Não</span>
          </label>
        </div>
      </div>
    </div>
  </div>
</div>
